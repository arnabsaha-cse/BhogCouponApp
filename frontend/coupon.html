<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhog Coupon</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #e65100 0%, #ff8f00 50%, #c62828 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            padding: 28px;
            max-width: 420px;
            width: 100%;
            text-align: center;
        }

        .header { margin-bottom: 20px; }
        .header .logo { max-height: 80px; margin-bottom: 8px; border-radius: 8px; }
        .header .icon { font-size: 40px; margin-bottom: 6px; }
        .header h1 { font-size: 20px; color: #c62828; margin-bottom: 2px; }
        .header .subtitle { font-size: 14px; color: #e65100; font-weight: 600; }

        /* Loading state */
        .loading { color: #888; font-size: 15px; padding: 40px 0; }
        .spinner {
            display: inline-block;
            width: 24px; height: 24px;
            border: 3px solid #e0e0e0;
            border-top-color: #e65100;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Error state */
        .error-box {
            display: none;
            background: #fff3f3;
            border: 2px solid #e74c3c;
            border-radius: 12px;
            padding: 20px;
            color: #c0392b;
            font-size: 14px;
        }

        /* Coupon card */
        .coupon-card { display: none; }

        .coupon-card .summary-table {
            width: 100%;
            text-align: left;
            background: #f9f9f9;
            border-radius: 10px;
            padding: 12px;
            margin: 14px 0;
            font-size: 14px;
        }
        .coupon-card .summary-table .info-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #eee;
        }
        .coupon-card .summary-table .info-row:last-child { border-bottom: none; }
        .coupon-card .summary-table .info-row .label { font-weight: 600; color: #333; }
        .coupon-card .summary-table .info-row .value { color: #555; }

        .coupon-code-box {
            background: linear-gradient(135deg, #f0f4ff 0%, #e8ecff 100%);
            border: 2px dashed #667eea;
            border-radius: 14px;
            padding: 18px;
            margin: 16px 0;
        }
        .coupon-code-box .code-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        .coupon-code-box .code {
            font-size: 32px;
            font-weight: 800;
            color: #1a1a2e;
            letter-spacing: 4px;
        }
        .coupon-code-box .plates-info {
            margin-top: 8px;
            font-size: 15px;
            color: #e65100;
            font-weight: 600;
        }

        .qr-section { margin: 16px 0; }
        .qr-section p { font-size: 12px; color: #aaa; margin-top: 8px; }

        .status-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            margin: 8px 0 14px;
        }
        .status-badge.valid { background: #d4edda; color: #155724; }
        .status-badge.redeemed { background: #f8d7da; color: #721c24; }
        .status-badge.loading-status { background: #e2e3e5; color: #383d41; }

        .note {
            font-size: 11px;
            color: #aaa;
            margin-top: 16px;
            line-height: 1.6;
        }

        .btn-screenshot {
            display: inline-block;
            padding: 10px 20px;
            background: #27ae60;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        @media print {
            body { background: #fff; }
            .container { box-shadow: none; }
            .btn-screenshot { display: none; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div id="headerLogo" class="icon">🪷</div>
        <h1>Agomoni Durga Puja 2026</h1>
        <div class="subtitle">Bhog Distribution Coupon</div>
    </div>

    <!-- Loading -->
    <div class="loading" id="loadingState">
        <div class="spinner"></div><br>
        Looking up your coupon...
    </div>

    <!-- Error -->
    <div class="error-box" id="errorBox"></div>

    <!-- Coupon display -->
    <div class="coupon-card" id="couponCard">
        <div class="coupon-code-box">
            <div class="code-label">Your Coupon Code</div>
            <div class="code" id="dispCode">—</div>
            <div class="plates-info" id="dispPlates"></div>
        </div>

        <div id="statusBadge" class="status-badge loading-status">Checking...</div>

        <div class="summary-table">
            <div class="info-row">
                <span class="label">Name</span>
                <span class="value" id="dispName">—</span>
            </div>
            <div class="info-row">
                <span class="label">Phone</span>
                <span class="value" id="dispPhone">—</span>
            </div>
            <div class="info-row">
                <span class="label">Event Date</span>
                <span class="value" id="dispDate">—</span>
            </div>
            <div class="info-row" id="redeemedAtRow" style="display:none;">
                <span class="label">Redeemed At</span>
                <span class="value" id="dispRedeemedAt">—</span>
            </div>
        </div>

        <div class="qr-section">
            <div id="qrCanvas"></div>
            <p>Show this QR or the code above to the organiser</p>
        </div>

        <button class="btn-screenshot" onclick="screenshotHint()">📸 Screenshot This</button>
    </div>

    <p class="note">This coupon is unique to you. Do not share it. Present it at the distribution point.</p>
</div>

<!-- Config -->
<script src="config.js"></script>
<!-- QR Code library -->
<script>document.write('<script src="' + CONFIG.QRCODE_LIB_URL + '"><\/script>');</script>

<script>
    // ── Logo ──────────────────────────────────────────────────────
    (function() {
        if (CONFIG.EVENT_LOGO_URL) {
            var el = document.getElementById('headerLogo');
            var img = document.createElement('img');
            img.src = CONFIG.EVENT_LOGO_URL;
            img.alt = 'Event Logo';
            img.className = 'logo';
            el.innerHTML = '';
            el.className = '';
            el.appendChild(img);
        }
    })();

    // ── JSONP helper ──────────────────────────────────────────────
    var _cbId = 0;
    function jsonpCall(params, onSuccess, onError) {
        var cbName = 'couponCb_' + (++_cbId) + '_' + Date.now();
        params.callback = cbName;
        var url = CONFIG.APPS_SCRIPT_URL + '?' + new URLSearchParams(params).toString();
        var script = document.createElement('script');
        script.src = url;
        var timeout = setTimeout(function() {
            cleanup();
            if (onError) onError('timeout');
        }, 15000);
        function cleanup() {
            clearTimeout(timeout);
            if (script.parentNode) script.parentNode.removeChild(script);
            delete window[cbName];
        }
        window[cbName] = function(result) { cleanup(); onSuccess(result); };
        script.onerror = function() { cleanup(); if (onError) onError('network'); };
        document.body.appendChild(script);
    }

    // ── Read ?code= from URL ──────────────────────────────────────
    function getParam(name) {
        var params = new URLSearchParams(window.location.search);
        return params.get(name);
    }

    // ── Format date nicely ────────────────────────────────────────
    function fmtDate(dateStr) {
        try {
            var d = new Date(dateStr + 'T00:00:00');
            return d.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        } catch(e) { return dateStr; }
    }

    // ── Render coupon data ────────────────────────────────────────
    function showCoupon(result) {
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('couponCard').style.display = 'block';

        document.getElementById('dispCode').textContent = result.couponCode;
        document.getElementById('dispPlates').textContent = result.plates + ' coupon(s) / plate(s)';
        document.getElementById('dispName').textContent = result.name;
        document.getElementById('dispPhone').textContent = result.phone;
        document.getElementById('dispDate').textContent = fmtDate(result.date);

        var badge = document.getElementById('statusBadge');
        if (result.redeemed) {
            badge.textContent = '✅ Redeemed';
            badge.className = 'status-badge redeemed';
            var rat = document.getElementById('redeemedAtRow');
            rat.style.display = 'flex';
            document.getElementById('dispRedeemedAt').textContent = result.redeemedAt || 'Unknown';
        } else {
            badge.textContent = '🟢 Valid — Not Yet Redeemed';
            badge.className = 'status-badge valid';
        }

        // QR code points to this same page URL (self-referential, useful for re-scanning)
        var qrContainer = document.getElementById('qrCanvas');
        qrContainer.innerHTML = '';
        new QRCode(qrContainer, {
            text: window.location.href,
            width: 180,
            height: 180,
            colorDark: '#1a1a2e',
            colorLight: '#ffffff'
        });
    }

    function showError(msg) {
        document.getElementById('loadingState').style.display = 'none';
        var box = document.getElementById('errorBox');
        box.style.display = 'block';
        box.innerHTML = '❌ ' + msg;
    }

    function screenshotHint() {
        alert('📸 Take a screenshot!\n\nOn iPhone: Side + Volume Up\nOn Android: Power + Volume Down');
    }

    // ── Main: lookup by code ──────────────────────────────────────
    (function() {
        var code = getParam('code');
        if (!code) {
            showError('No coupon code found in the link. Please use the link provided in your WhatsApp/SMS message.');
            return;
        }

        jsonpCall(
            { action: 'lookup', code: code.toUpperCase() },
            function(result) {
                if (result.status === 'found') {
                    showCoupon(result);
                } else if (result.status === 'notfound') {
                    showError('Coupon code <strong>' + code.toUpperCase() + '</strong> was not found. Please check the code and try again.');
                } else {
                    showError('Could not load coupon: ' + (result.message || 'Unknown error'));
                }
            },
            function(err) {
                showError('Connection error. Please check your internet and reload the page.');
            }
        );
    })();
</script>
</body>
</html>
